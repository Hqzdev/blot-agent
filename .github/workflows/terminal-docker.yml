name: Terminal Docker build

on:
  pull_request:
  push:
    branches: [main, 'mac/**', 'ios/**', 'windows/**', 'android/**']

permissions:
  contents: read

defaults:
  run:
    working-directory: apps/terminal

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - run: docker compose build
