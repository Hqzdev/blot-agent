server.address=${BLOT_CLOUD_ADDRESS:127.0.0.1}
server.port=${BLOT_CLOUD_PORT:8081}
spring.main.banner-mode=off
server.error.include-message=never
server.error.include-stacktrace=never
spring.servlet.multipart.max-file-size=1MB
server.max-http-request-header-size=16KB
blot.cloud.database=${BLOT_CLOUD_DATABASE:./data/cloud.sqlite}
blot.cloud.quota-tokens=${BLOT_CLOUD_DAILY_TOKENS:20000}
logging.level.org.springframework.web=INFO
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.mvc.async.request-timeout=180000
server.tomcat.accesslog.enabled=false
server.tomcat.max-swallow-size=1MB
spring.mvc.log-request-details=false
blot.cloud.relay-bytes=${BLOT_CLOUD_RELAY_BYTES:536870912}
