<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">Signed internal request protocol</title>
  <desc id="desc">The web BFF signs method, target, timestamp, actor, and body digest with HMAC SHA-256; services verify freshness and signature before dispatching typed RPC.</desc>
  <defs>
    <marker id="rpc-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#60a5fa"/>
    </marker>
  </defs>
  <rect width="1200" height="500" rx="28" fill="#0b0d10"/>
  <text x="56" y="62" fill="#f4f6f8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="42" font-weight="700">Signed internal RPC</text>
  <text x="56" y="96" fill="#8c96a3" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="20">Remote service calls carry an authenticated actor, not browser credentials.</text>
  <g id="rpc-sender" transform="translate(56 154)" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <rect width="250" height="190" rx="22" fill="#17243a" stroke="#60a5fa" stroke-width="2"/>
    <text x="26" y="42" fill="#f4f6f8" font-size="24" font-weight="700">Web BFF</text>
    <text x="26" y="78" fill="#d9dee5" font-size="18">Build canonical input</text>
    <text x="26" y="108" fill="#d9dee5" font-size="18">Hash request body</text>
    <text x="26" y="138" fill="#d9dee5" font-size="18">Sign with SHA-256 HMAC</text>
    <text x="26" y="168" fill="#9dc8ff" font-size="17">attach actor + request id</text>
  </g>
  <path d="M316 249H418" stroke="#60a5fa" stroke-width="3" marker-end="url(#rpc-arrow)"/>
  <g id="rpc-envelope" transform="translate(430 130)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
    <rect width="340" height="238" rx="22" fill="#11151a" stroke="#313b47" stroke-width="2"/>
    <text x="24" y="38" fill="#7dd3fc" font-size="18">METHOD</text>
    <text x="154" y="38" fill="#d9dee5" font-size="18">POST</text>
    <text x="24" y="72" fill="#7dd3fc" font-size="18">TARGET</text>
    <text x="154" y="72" fill="#d9dee5" font-size="18">/api/rpc</text>
    <text x="24" y="106" fill="#7dd3fc" font-size="18">TIMESTAMP</text>
    <text x="154" y="106" fill="#d9dee5" font-size="18">milliseconds</text>
    <text x="24" y="140" fill="#7dd3fc" font-size="18">ACTOR</text>
    <text x="154" y="140" fill="#d9dee5" font-size="18">user UUID</text>
    <text x="24" y="174" fill="#7dd3fc" font-size="18">BODY</text>
    <text x="154" y="174" fill="#d9dee5" font-size="18">SHA-256 digest</text>
    <text x="24" y="212" fill="#8c96a3" font-size="16">x-teya-signature</text>
  </g>
  <path d="M780 249H882" stroke="#60a5fa" stroke-width="3" marker-end="url(#rpc-arrow)"/>
  <g id="rpc-receiver" transform="translate(894 154)" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <rect width="250" height="190" rx="22" fill="#11151a" stroke="#313b47" stroke-width="2"/>
    <text x="26" y="42" fill="#f4f6f8" font-size="24" font-weight="700">Domain service</text>
    <text x="26" y="78" fill="#d9dee5" font-size="18">Check required headers</text>
    <text x="26" y="108" fill="#d9dee5" font-size="18">Enforce 60 s tolerance</text>
    <text x="26" y="138" fill="#d9dee5" font-size="18">Timing-safe comparison</text>
    <text x="26" y="168" fill="#9dc8ff" font-size="17">dispatch typed operation</text>
  </g>
  <text x="600" y="438" text-anchor="middle" fill="#aeb7c2" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="19">The shared secret never crosses the server boundary.</text>
</svg>
