<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="590" viewBox="0 0 1200 590" role="img" aria-labelledby="title desc">
  <title id="title">Vercel deployment topology</title>
  <desc id="desc">Five Vercel projects deploy from one pnpm workspace: the web application and four domain services connected to PostgreSQL and external providers.</desc>
  <defs>
    <marker id="deploy-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#60a5fa"/>
    </marker>
  </defs>
  <rect width="1200" height="590" rx="28" fill="#0b0d10"/>
  <text x="56" y="62" fill="#f4f6f8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="42" font-weight="700">Deployment topology</text>
  <text x="56" y="96" fill="#8c96a3" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="20">One repository, five independently deployable Vercel projects.</text>
  <g id="deployment-browser" transform="translate(56 150)" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <rect width="188" height="86" rx="18" fill="#11151a" stroke="#313b47" stroke-width="2"/>
    <text x="94" y="36" text-anchor="middle" fill="#f4f6f8" font-size="22" font-weight="700">Browser</text>
    <text x="94" y="64" text-anchor="middle" fill="#8c96a3" font-size="17">public traffic</text>
  </g>
  <path d="M252 193H332" stroke="#60a5fa" stroke-width="3" marker-end="url(#deploy-arrow)"/>
  <g id="deployment-web" transform="translate(344 132)" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <rect width="300" height="122" rx="22" fill="#17243a" stroke="#60a5fa" stroke-width="2"/>
    <text x="26" y="42" fill="#f4f6f8" font-size="24" font-weight="700">Web project</text>
    <text x="26" y="75" fill="#d9dee5" font-size="18">root: repository root</text>
    <text x="26" y="102" fill="#9dc8ff" font-size="17">Next.js · BFF · cron</text>
  </g>
  <path d="M652 193H732" stroke="#60a5fa" stroke-width="3" marker-end="url(#deploy-arrow)"/>
  <g id="deployment-services" transform="translate(744 132)" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <rect width="400" height="122" rx="22" fill="#11151a" stroke="#313b47" stroke-width="2"/>
    <text x="26" y="40" fill="#f4f6f8" font-size="23" font-weight="700">Service projects</text>
    <text x="26" y="73" fill="#d9dee5" font-size="18">identity · conversation · billing · ai-gateway</text>
    <text x="26" y="101" fill="#8c96a3" font-size="17">workspace packages included at build time</text>
  </g>
  <path d="M494 262V316M944 262V316M494 316H944" stroke="#485463" stroke-width="2"/>
  <g id="deployment-resources" transform="translate(56 348)" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <g>
      <rect width="250" height="126" rx="20" fill="#11151a" stroke="#313b47" stroke-width="2"/>
      <text x="24" y="39" fill="#f4f6f8" font-size="22" font-weight="700">PostgreSQL</text>
      <text x="24" y="72" fill="#aeb7c2" font-size="17">shared database</text>
      <text x="24" y="99" fill="#aeb7c2" font-size="17">four schemas</text>
    </g>
    <g transform="translate(278)">
      <rect width="250" height="126" rx="20" fill="#11151a" stroke="#313b47" stroke-width="2"/>
      <text x="24" y="39" fill="#f4f6f8" font-size="22" font-weight="700">Vercel Blob</text>
      <text x="24" y="72" fill="#aeb7c2" font-size="17">user files</text>
      <text x="24" y="99" fill="#aeb7c2" font-size="17">generated assets</text>
    </g>
    <g transform="translate(556)">
      <rect width="250" height="126" rx="20" fill="#11151a" stroke="#313b47" stroke-width="2"/>
      <text x="24" y="39" fill="#f4f6f8" font-size="22" font-weight="700">Upstash Redis</text>
      <text x="24" y="72" fill="#aeb7c2" font-size="17">production</text>
      <text x="24" y="99" fill="#aeb7c2" font-size="17">rate limiting</text>
    </g>
    <g transform="translate(834)">
      <rect width="250" height="126" rx="20" fill="#11151a" stroke="#313b47" stroke-width="2"/>
      <text x="24" y="39" fill="#f4f6f8" font-size="22" font-weight="700">Providers</text>
      <text x="24" y="72" fill="#aeb7c2" font-size="17">GigaChat · YooKassa</text>
      <text x="24" y="99" fill="#aeb7c2" font-size="17">Search integrations</text>
    </g>
  </g>
  <text x="56" y="532" fill="#7dd3fc" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17">DEPLOY SERVICES FIRST · THEN CONFIGURE SERVICE URLS ON THE WEB PROJECT</text>
</svg>
