      <rect x="130" width="126" height="42" rx="21"/>
      <rect x="268" width="104" height="42" rx="21"/>
      <rect x="384" width="108" height="42" rx="21"/>
    </g>
    <g transform="translate(0 257)" fill="#aeb7c2" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="17" font-weight="600" text-anchor="middle">
      <text x="59">Projects</text>
      <text x="193">Skills</text>
      <text x="320">Library</text>
      <text x="438">Images</text>
    </g>
  </g>
  <g id="hero-system-map" transform="translate(650 112)">
