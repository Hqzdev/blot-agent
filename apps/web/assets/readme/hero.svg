    <text x="28" y="38" fill="#8c96a3" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" letter-spacing="1.5">REQUEST PATH</text>
    <g transform="translate(28 67)">
      <rect width="118" height="60" rx="14" fill="#171c22" stroke="#3a4552"/>
      <text x="59" y="37" text-anchor="middle" fill="#f4f6f8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="20" font-weight="600">Browser</text>
      <path d="M126 30H166" stroke="#60a5fa" stroke-width="3" marker-end="url(#hero-arrow)"/>
      <rect x="176" width="130" height="60" rx="14" fill="#17243a" stroke="#60a5fa"/>
      <text x="241" y="26" text-anchor="middle" fill="#f4f6f8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="19" font-weight="650">Next.js</text>
      <text x="241" y="47" text-anchor="middle" fill="#9dc8ff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15">BFF</text>
      <path d="M314 30H354" stroke="#60a5fa" stroke-width="3" marker-end="url(#hero-arrow)"/>
      <rect x="364" width="100" height="60" rx="14" fill="#171c22" stroke="#3a4552"/>
      <text x="414" y="26" text-anchor="middle" fill="#f4f6f8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="18" font-weight="600">Domain</text>
      <text x="414" y="47" text-anchor="middle" fill="#aeb7c2" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="16">services</text>
    </g>
    <path d="M269 142V165" stroke="#60a5fa" stroke-width="3"/>
    <path d="M78 165H414" stroke="#60a5fa" stroke-width="3"/>
    <g transform="translate(28 165)" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="16" font-weight="600" text-anchor="middle">
