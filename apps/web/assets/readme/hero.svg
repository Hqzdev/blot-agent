<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Teya AI workspace</title>
  <desc id="desc">Teya connects chat, projects, skills, files, image generation, and isolated backend services in one AI workspace.</desc>
  <defs>
    <linearGradient id="hero-accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <marker id="hero-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#60a5fa"/>
    </marker>
  </defs>
  <rect width="1200" height="420" rx="28" fill="#0b0d10"/>
  <path d="M0 78H1200" stroke="#252b33"/>
  <text x="58" y="49" fill="#8c96a3" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" letter-spacing="2">AI WORKSPACE · NEXT.JS · DOMAIN SERVICES</text>
  <g id="hero-title" transform="translate(58 124)">
    <text x="0" y="76" fill="#f4f6f8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="92" font-weight="700" letter-spacing="-4">Teya</text>
    <rect x="0" y="102" width="82" height="6" rx="3" fill="url(#hero-accent)"/>
    <text x="0" y="152" fill="#d9dee5" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="25" font-weight="500">One workspace for conversation, context,</text>
    <text x="0" y="187" fill="#d9dee5" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="25" font-weight="500">creation, and private project knowledge.</text>
    <g transform="translate(0 230)" fill="none" stroke="#39424d">
