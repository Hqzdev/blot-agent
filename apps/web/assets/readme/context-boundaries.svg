<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
  <title id="title">Project memory and skill loading boundaries</title>
  <desc id="desc">Project context and installed skills are independently constrained, owner checked, and treated as lower-priority user data before entering the model prompt.</desc>
  <defs>
    <marker id="context-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#60a5fa"/>
    </marker>
  </defs>
  <rect width="1200" height="610" rx="28" fill="#0b0d10"/>
  <text x="56" y="62" fill="#f4f6f8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="42" font-weight="700">Context boundaries</text>
  <text x="56" y="96" fill="#8c96a3" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="20">Project knowledge and skills enrich a request without widening access.</text>
  <g id="project-context" transform="translate(56 142)" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <rect width="492" height="310" rx="22" fill="#11151a" stroke="#313b47" stroke-width="2"/>
    <text x="28" y="44" fill="#f4f6f8" font-size="25" font-weight="700">Project-only memory</text>
    <text x="28" y="78" fill="#8c96a3" font-size="18">Only records owned by the current project</text>
    <g transform="translate(28 112)">
      <rect width="204" height="72" rx="15" fill="#17243a"/>
      <text x="18" y="29" fill="#9dc8ff" font-size="18" font-weight="650">Other project chats</text>
      <text x="18" y="55" fill="#d9dee5" font-size="17">20 messages · 12k chars</text>
      <rect x="232" width="204" height="72" rx="15" fill="#17243a"/>
      <text x="250" y="29" fill="#9dc8ff" font-size="18" font-weight="650">Project sources</text>
      <text x="250" y="55" fill="#d9dee5" font-size="17">8k/file · 24k total</text>
    </g>
    <path d="M246 202V232" stroke="#60a5fa" stroke-width="3" marker-end="url(#context-arrow)"/>
    <text x="28" y="270" fill="#d9dee5" font-size="18">Current chat excluded from memory recall</text>
    <text x="28" y="296" fill="#7dd3fc" font-size="18">External chats never enter the project context</text>
  </g>
  <g id="skill-context" transform="translate(652 142)" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <rect width="492" height="310" rx="22" fill="#11151a" stroke="#313b47" stroke-width="2"/>
    <text x="28" y="44" fill="#f4f6f8" font-size="25" font-weight="700">Installed skills</text>
    <text x="28" y="78" fill="#8c96a3" font-size="18">Metadata first, instructions only on demand</text>
    <g transform="translate(28 112)">
      <rect width="204" height="72" rx="15" fill="#17243a"/>
      <text x="18" y="29" fill="#9dc8ff" font-size="18" font-weight="650">Catalog metadata</text>
      <text x="18" y="55" fill="#d9dee5" font-size="17">6k prompt budget</text>
      <rect x="232" width="204" height="72" rx="15" fill="#17243a"/>
      <text x="250" y="29" fill="#9dc8ff" font-size="18" font-weight="650">loadSkill</text>
      <text x="250" y="55" fill="#d9dee5" font-size="17">2 skills · 16k chars</text>
    </g>
    <path d="M246 202V232" stroke="#60a5fa" stroke-width="3" marker-end="url(#context-arrow)"/>
    <text x="28" y="270" fill="#d9dee5" font-size="18">Ownership and installation rechecked</text>
    <text x="28" y="296" fill="#7dd3fc" font-size="18">Full instructions never persist in history</text>
  </g>
  <g id="context-policy" transform="translate(174 500)" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <rect width="852" height="66" rx="18" fill="#17243a" stroke="#60a5fa"/>
    <text x="426" y="40" text-anchor="middle" fill="#dcecff" font-size="20" font-weight="650">Sources and custom instructions are untrusted data below system policy</text>
  </g>
</svg>
