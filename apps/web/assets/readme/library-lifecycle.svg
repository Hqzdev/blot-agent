<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="590" viewBox="0 0 1200 590" role="img" aria-labelledby="title desc">
  <title id="title">Library file lifecycle</title>
  <desc id="desc">Files are validated, written to Blob and PostgreSQL metadata, exposed through the Library, then soft deleted for thirty days before idempotent purge.</desc>
  <defs>
    <marker id="library-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#60a5fa"/>
    </marker>
  </defs>
  <rect width="1200" height="590" rx="28" fill="#0b0d10"/>
  <text x="56" y="62" fill="#f4f6f8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="42" font-weight="700">Library lifecycle</text>
  <text x="56" y="96" fill="#8c96a3" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="20">Blob content and relational metadata move together through every state.</text>
  <g id="library-stages" transform="translate(56 148)" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <g>
      <rect width="188" height="132" rx="20" fill="#11151a" stroke="#313b47" stroke-width="2"/>
      <text x="22" y="38" fill="#f4f6f8" font-size="22" font-weight="700">Ingest</text>
      <text x="22" y="70" fill="#aeb7c2" font-size="17">Upload</text>
      <text x="22" y="94" fill="#aeb7c2" font-size="17">Generated image</text>
      <text x="22" y="118" fill="#aeb7c2" font-size="17">Artifact version</text>
    </g>
    <path d="M196 66H244" stroke="#60a5fa" stroke-width="3" marker-end="url(#library-arrow)"/>
    <g transform="translate(256)">
      <rect width="188" height="132" rx="20" fill="#11151a" stroke="#313b47" stroke-width="2"/>
      <text x="22" y="38" fill="#f4f6f8" font-size="22" font-weight="700">Validate</text>
      <text x="22" y="70" fill="#aeb7c2" font-size="17">MIME and size</text>
      <text x="22" y="94" fill="#aeb7c2" font-size="17">owner and folder</text>
      <text x="22" y="118" fill="#7dd3fc" font-size="17">25 MB max</text>
    </g>
    <path d="M452 66H500" stroke="#60a5fa" stroke-width="3" marker-end="url(#library-arrow)"/>
    <g transform="translate(512)">
      <rect width="264" height="132" rx="20" fill="#17243a" stroke="#60a5fa" stroke-width="2"/>
      <text x="22" y="38" fill="#f4f6f8" font-size="22" font-weight="700">Persist</text>
      <text x="22" y="70" fill="#d9dee5" font-size="17">Vercel Blob object</text>
      <text x="22" y="94" fill="#d9dee5" font-size="17">object_files metadata</text>
      <text x="22" y="118" fill="#9dc8ff" font-size="17">library_items catalog row</text>
    </g>
    <path d="M784 66H832" stroke="#60a5fa" stroke-width="3" marker-end="url(#library-arrow)"/>
    <g transform="translate(844)">
      <rect width="244" height="132" rx="20" fill="#11151a" stroke="#313b47" stroke-width="2"/>
      <text x="22" y="38" fill="#f4f6f8" font-size="22" font-weight="700">Use</text>
      <text x="22" y="70" fill="#aeb7c2" font-size="17">Search and filter</text>
      <text x="22" y="94" fill="#aeb7c2" font-size="17">Move and download</text>
      <text x="22" y="118" fill="#aeb7c2" font-size="17">Chat or project reference</text>
    </g>
  </g>
  <path d="M1022 290V340H866" stroke="#60a5fa" stroke-width="3" marker-end="url(#library-arrow)"/>
  <g id="library-deletion" transform="translate(56 350)" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <rect width="480" height="154" rx="22" fill="#11151a" stroke="#313b47" stroke-width="2"/>
    <text x="26" y="42" fill="#f4f6f8" font-size="23" font-weight="700">Trash</text>
    <text x="26" y="76" fill="#aeb7c2" font-size="18">Hidden immediately from Library, project sources,</text>
    <text x="26" y="103" fill="#aeb7c2" font-size="18">AI context, and attachment access.</text>
    <text x="26" y="134" fill="#7dd3fc" font-size="18" font-weight="600">Restore remains available for 30 days</text>
    <path d="M494 77H570" stroke="#60a5fa" stroke-width="3" marker-end="url(#library-arrow)"/>
    <rect x="584" width="504" height="154" rx="22" fill="#11151a" stroke="#313b47" stroke-width="2"/>
    <text x="610" y="42" fill="#f4f6f8" font-size="23" font-weight="700">Purge</text>
    <text x="610" y="76" fill="#aeb7c2" font-size="18">Daily cron selects expired roots and deletes</text>
    <text x="610" y="103" fill="#aeb7c2" font-size="18">artifacts, sources, metadata, and Blob objects.</text>
    <text x="610" y="134" fill="#7dd3fc" font-size="18" font-weight="600">Idempotent cleanup protected by CRON_SECRET</text>
  </g>
  <text x="56" y="552" fill="#8c96a3" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17">PROJECT SOURCES: 5 MB MAX · TEXT EXTRACTED FOR PROJECT-ONLY CONTEXT</text>
</svg>
