<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="690" viewBox="0 0 1200 690" role="img" aria-labelledby="title desc">
  <title id="title">Teya system architecture</title>
  <desc id="desc">The browser calls the Next.js web application, which routes authenticated requests to four domain services using local composition or signed HTTP RPC.</desc>
  <defs>
    <marker id="architecture-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#60a5fa"/>
    </marker>
  </defs>
  <rect width="1200" height="690" rx="28" fill="#0b0d10"/>
  <text x="56" y="62" fill="#f4f6f8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="42" font-weight="700">System architecture</text>
  <text x="56" y="96" fill="#8c96a3" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="20">The public boundary ends at the web application.</text>
  <g id="architecture-client" transform="translate(56 140)">
    <rect width="210" height="92" rx="18" fill="#11151a" stroke="#313b47" stroke-width="2"/>
    <text x="24" y="38" fill="#f4f6f8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="23" font-weight="650">Browser</text>
    <text x="24" y="68" fill="#8c96a3" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17">UI · session · stream</text>
  </g>
  <path d="M274 186H350" stroke="#60a5fa" stroke-width="3" marker-end="url(#architecture-arrow)"/>
  <g id="architecture-web" transform="translate(362 126)">
    <rect width="350" height="120" rx="22" fill="#17243a" stroke="#60a5fa" stroke-width="2"/>
    <text x="28" y="43" fill="#f4f6f8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="25" font-weight="700">Next.js web + BFF</text>
    <text x="28" y="76" fill="#c6d9f3" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="18">Auth · validation · orchestration</text>
    <text x="28" y="103" fill="#9dc8ff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16">public API surface</text>
  </g>
  <path d="M720 186H796" stroke="#60a5fa" stroke-width="3" marker-end="url(#architecture-arrow)"/>
  <g id="architecture-storage" transform="translate(808 140)">
    <rect width="336" height="92" rx="18" fill="#11151a" stroke="#313b47" stroke-width="2"/>
    <text x="24" y="38" fill="#f4f6f8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="22" font-weight="650">Vercel Blob</text>
    <text x="24" y="68" fill="#8c96a3" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="18">Uploads · generated files · cleanup</text>
  </g>
  <path d="M537 254V300" stroke="#60a5fa" stroke-width="3"/>
  <path d="M152 300H1048" stroke="#60a5fa" stroke-width="3"/>
  <text x="600" y="285" text-anchor="middle" fill="#9dc8ff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16">LOCAL COMPOSITION OR HMAC-SIGNED RPC</text>
  <g id="architecture-services" transform="translate(56 322)" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <g>
      <rect width="252" height="144" rx="20" fill="#11151a" stroke="#313b47" stroke-width="2"/>
      <text x="24" y="40" fill="#f4f6f8" font-size="23" font-weight="650">Identity</text>
      <text x="24" y="72" fill="#aeb7c2" font-size="17">Accounts and OAuth</text>
      <text x="24" y="98" fill="#aeb7c2" font-size="17">Profile and passwords</text>
      <text x="24" y="124" fill="#7dd3fc" font-size="16">schema: identity</text>
    </g>
    <g transform="translate(278)">
      <rect width="252" height="144" rx="20" fill="#11151a" stroke="#313b47" stroke-width="2"/>
      <text x="24" y="40" fill="#f4f6f8" font-size="23" font-weight="650">Conversation</text>
      <text x="24" y="72" fill="#aeb7c2" font-size="17">Chats and projects</text>
      <text x="24" y="98" fill="#aeb7c2" font-size="17">Artifacts and library</text>
      <text x="24" y="124" fill="#7dd3fc" font-size="16">schema: conversation</text>
    </g>
    <g transform="translate(556)">
      <rect width="252" height="144" rx="20" fill="#11151a" stroke="#313b47" stroke-width="2"/>
      <text x="24" y="40" fill="#f4f6f8" font-size="23" font-weight="650">Billing</text>
      <text x="24" y="72" fill="#aeb7c2" font-size="17">Plans and checkout</text>
      <text x="24" y="98" fill="#aeb7c2" font-size="17">Verified webhooks</text>
      <text x="24" y="124" fill="#7dd3fc" font-size="16">schema: billing</text>
    </g>
    <g transform="translate(834)">
      <rect width="252" height="144" rx="20" fill="#11151a" stroke="#313b47" stroke-width="2"/>
      <text x="24" y="40" fill="#f4f6f8" font-size="23" font-weight="650">AI gateway</text>
      <text x="24" y="72" fill="#aeb7c2" font-size="17">GigaChat and search</text>
      <text x="24" y="98" fill="#aeb7c2" font-size="17">Skill repository</text>
      <text x="24" y="124" fill="#7dd3fc" font-size="16">schema: ai</text>
    </g>
  </g>
  <path d="M182 474V520M460 474V520M738 474V520M1016 474V520M182 520H1016" stroke="#485463" stroke-width="2"/>
  <g id="architecture-infrastructure" transform="translate(180 544)" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <rect width="360" height="94" rx="18" fill="#15191f" stroke="#313b47" stroke-width="2"/>
    <text x="24" y="38" fill="#f4f6f8" font-size="22" font-weight="650">PostgreSQL</text>
    <text x="24" y="68" fill="#8c96a3" font-size="18">Four schemas · one ownership model</text>
    <rect x="480" width="360" height="94" rx="18" fill="#15191f" stroke="#313b47" stroke-width="2"/>
    <text x="504" y="38" fill="#f4f6f8" font-size="22" font-weight="650">External providers</text>
    <text x="504" y="68" fill="#8c96a3" font-size="18">GigaChat · YooKassa · Search · Redis</text>
  </g>
</svg>
