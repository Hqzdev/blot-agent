<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Teya product map</title>
  <desc id="desc">Six product surfaces share authentication, conversation data, AI models, skills, and file storage.</desc>
  <defs>
    <marker id="product-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#60a5fa"/>
    </marker>
  </defs>
  <rect width="1200" height="520" rx="28" fill="#0b0d10"/>
  <text x="56" y="60" fill="#f4f6f8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="42" font-weight="700">Product surfaces</text>
  <text x="56" y="94" fill="#8c96a3" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="20">Independent workflows, one authenticated workspace.</text>
  <g id="product-surfaces" transform="translate(56 136)" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <g transform="translate(0 0)">
      <rect width="336" height="122" rx="20" fill="#11151a" stroke="#313b47" stroke-width="2"/>
      <text x="24" y="40" fill="#f4f6f8" font-size="24" font-weight="650">Chat</text>
      <text x="24" y="72" fill="#aeb7c2" font-size="18">Streaming answers, reasoning,</text>
      <text x="24" y="98" fill="#aeb7c2" font-size="18">search, attachments, artifacts</text>
    </g>
    <g transform="translate(376 0)">
      <rect width="336" height="122" rx="20" fill="#11151a" stroke="#313b47" stroke-width="2"/>
      <text x="24" y="40" fill="#f4f6f8" font-size="24" font-weight="650">Projects</text>
      <text x="24" y="72" fill="#aeb7c2" font-size="18">Private chats, source files,</text>
      <text x="24" y="98" fill="#aeb7c2" font-size="18">project-only context</text>
    </g>
    <g transform="translate(752 0)">
      <rect width="336" height="122" rx="20" fill="#11151a" stroke="#313b47" stroke-width="2"/>
      <text x="24" y="40" fill="#f4f6f8" font-size="24" font-weight="650">Skills</text>
      <text x="24" y="72" fill="#aeb7c2" font-size="18">Installed playbooks loaded</text>
      <text x="24" y="98" fill="#aeb7c2" font-size="18">only when the model needs them</text>
    </g>
    <g transform="translate(0 154)">
      <rect width="336" height="122" rx="20" fill="#11151a" stroke="#313b47" stroke-width="2"/>
      <text x="24" y="40" fill="#f4f6f8" font-size="24" font-weight="650">Library</text>
      <text x="24" y="72" fill="#aeb7c2" font-size="18">Files, folders, artifacts,</text>
      <text x="24" y="98" fill="#aeb7c2" font-size="18">filters, bulk actions, trash</text>
    </g>
    <g transform="translate(376 154)">
      <rect width="336" height="122" rx="20" fill="#11151a" stroke="#313b47" stroke-width="2"/>
      <text x="24" y="40" fill="#f4f6f8" font-size="24" font-weight="650">Images</text>
      <text x="24" y="72" fill="#aeb7c2" font-size="18">GigaChat Text2Image,</text>
      <text x="24" y="98" fill="#aeb7c2" font-size="18">history, prompt shortcuts</text>
    </g>
    <g transform="translate(752 154)">
      <rect width="336" height="122" rx="20" fill="#11151a" stroke="#313b47" stroke-width="2"/>
      <text x="24" y="40" fill="#f4f6f8" font-size="24" font-weight="650">Artifacts</text>
      <text x="24" y="72" fill="#aeb7c2" font-size="18">Versioned text, code,</text>
      <text x="24" y="98" fill="#aeb7c2" font-size="18">sheets, and generated images</text>
    </g>
  </g>
  <path d="M224 425H976" stroke="#25303b" stroke-width="2"/>
  <circle cx="600" cy="425" r="7" fill="#60a5fa"/>
  <text x="600" y="466" text-anchor="middle" fill="#d9dee5" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="20" font-weight="600">Shared identity · shared ownership rules · shared operational controls</text>
</svg>
